<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeLearn - Encontrar Tutores</title>
    <style>
        :root {
            --primary-purple: #8e679e;
            --dark-purple: #5e3a6e;
            --accent-orange: #d98e5e;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            /* Fondo morado que combina con la barra */
            background: linear-gradient(180deg, #a68cb0 0%, var(--primary-purple) 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #333;
        }

        /* Barra de navegación superior */
        .navbar {
            background-color: var(--primary-purple);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .navbar h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }

        .nav-links button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .nav-links button:hover {
            background: white;
            color: var(--primary-purple);
        }

        /* Contenedor Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Sección de Favoritos */
        #favorites-section {
            display: none;
            width: 90%;
            max-width: 400px;
            background: white;
            height: 70vh;
            position: absolute;
            top: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 20px;
            overflow-y: auto;
            z-index: 2000;
        }

        .fav-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .fav-avatar {
            background: var(--primary-purple);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stack de Tarjetas */
        .swipe-container {
            position: relative;
            width: 320px;
            height: 460px;
        }

        .tutor-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--white);
            border-radius: 25px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        /* Foto del tutor con sombra y textura */
        .tutor-photo {
            height: 65%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            /* Sombra interna para textura */
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
            border-bottom: 1px solid #ddd;
        }

        .tutor-details {
            padding: 20px;
            background: white;
        }

        .tutor-details h3 { margin: 0; color: var(--dark-purple); font-size: 1.4rem; }
        .tutor-details p { margin: 5px 0; font-size: 0.95rem; color: #666; }

        /* Controles */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 35px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.2s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-dislike { background: white; color: #ff5252; }
        .btn-like { background: var(--accent-orange); color: white; }
        .btn:hover { transform: scale(1.1); }
        .btn:active { transform: scale(0.9); }

        /* Animaciones */
        .swipe-left { transform: translateX(-1000px) rotate(-30deg) !important; opacity: 0; }
        .swipe-right { transform: translateX(1000px) rotate(30deg) !important; opacity: 0; }

        .close-favs {
            background: var(--dark-purple);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>SwipeLearn</h1>
        <div class="nav-links">
            <button onclick="toggleFavs()">Favoritos (<span id="fav-count">0</span>)</button>
        </div>
    </nav>

    <div class="main-content">
        <div id="favorites-section">
            <h2 style="color: var(--dark-purple)">Mis Conexiones</h2>
            <div id="fav-list"></div>
            <button class="close-favs" onclick="toggleFavs()">Volver a explorar</button>
        </div>

        <div class="swipe-container" id="card-stack">
            </div>

        <div class="controls">
            <button class="btn btn-dislike" onclick="handleSwipe('left')">✘</button>
            <button class="btn btn-like" onclick="handleSwipe('right')">✔</button>
        </div>
    </div>

    <script>
        const tutorData = [
            { id: 1, nombre: "Lucía M.", materia: "Física Cuántica", uni: "Complutense" },
            { id: 2, nombre: "Marcos T.", materia: "Derecho Civil", uni: "U. de Barcelona" },
            { id: 3, nombre: "Ana P.", materia: "Diseño UX/UI", uni: "IED Madrid" },
            { id: 4, nombre: "Pablo S.", materia: "Álgebra Lineal", uni: "Politécnica" }
        ];

        let favorites = [];
        const stack = document.getElementById('card-stack');
        const favList = document.getElementById('fav-list');
        const favCount = document.getElementById('fav-count');

        function initCards() {
            tutorData.forEach(tutor => {
                const card = document.createElement('div');
                card.className = 'tutor-card';
                card.dataset.id = tutor.id;
                card.innerHTML = `
                    <div class="tutor-photo">👤</div>
                    <div class="tutor-details">
                        <h3>${tutor.nombre}</h3>
                        <p><b>Especialidad:</b> ${tutor.materia}</p>
                        <p><b>Centro:</b> ${tutor.uni}</p>
                    </div>
                `;
                stack.appendChild(card);
            });
        }

        function handleSwipe(direction) {
            const cards = document.querySelectorAll('.tutor-card');
            if (cards.length === 0) return;

            const topCard = cards[cards.length - 1];
            const tutorId = parseInt(topCard.dataset.id);

            if (direction === 'right') {
                topCard.classList.add('swipe-right');
                addToFavorites(tutorId);
            } else {
                topCard.classList.add('swipe-left');
            }

            setTimeout(() => {
                topCard.remove();
                if (document.querySelectorAll('.tutor-card').length === 0) {
                    stack.innerHTML = "<div style='text-align:center; color:white;'><h3>¡No hay más tutores!</h3><p>Revisa tu lista de favoritos.</p></div>";
                }
            }, 500);
        }

        function addToFavorites(id) {
            const tutor = tutorData.find(t => t.id === id);
            if (!favorites.find(f => f.id === id)) {
                favorites.push(tutor);
                updateFavUI();
            }
        }

        function updateFavUI() {
            favCount.innerText = favorites.length;
            favList.innerHTML = favorites.map(f => `
                <div class="fav-item">
                    <div class="fav-avatar">👤</div>
                    <div>
                        <strong>${f.nombre}</strong><br>
                        <small>${f.materia}</small>
                    </div>
                </div>
            `).join('');
        }

        function toggleFavs() {
            const favSec = document.getElementById('favorites-section');
            favSec.style.display = favSec.style.display === 'block' ? 'none' : 'block';
        }

        initCards();
    </script>
</body>
</html>
