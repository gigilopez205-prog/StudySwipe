<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeLearn App</title>
    <style>
        :root {
            --primary-purple: #8e679e;
            --accent-orange: #d98e5e;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 15px;
            background: var(--primary-purple);
            color: white;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Contenedor de las tarjetas */
        .swipe-container {
            position: relative;
            width: 320px;
            height: 480px;
            margin-top: 50px;
        }

        .tutor-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.5s ease, opacity 0.5s ease;
            cursor: grab;
            user-select: none;
        }

        .tutor-image {
            width: 100%;
            height: 60%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .tutor-info {
            padding: 20px;
        }

        .tutor-info h3 {
            margin: 0;
            color: var(--primary-purple);
        }

        .tutor-info p {
            margin: 5px 0;
            font-size: 0.9em;
            color: #666;
        }

        /* Botones de acción */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-no { background: white; color: #ff4b2b; }
        .btn-yes { background: var(--accent-orange); color: white; }
        .btn:active { transform: scale(0.9); }

        /* Clases para animación de swipe */
        .swipe-left { transform: translateX(-1000px) rotate(-30deg) !important; opacity: 0; }
        .swipe-right { transform: translateX(1000px) rotate(30deg) !important; opacity: 0; }
    </style>
</head>
<body>

    <div class="header">SwipeLearn: Connect & Learn</div>

    <div class="swipe-container" id="cardStack">
        </div>

    <div class="controls">
        <button class="btn btn-no" onclick="swipe('left')">✘</button>
        <button class="btn btn-yes" onclick="swipe('right')">✔</button>
    </div>

    <script>
        const tutors = [
            { nombre: "Carlos R.", materia: "Cálculo II", uni: "Univ. Madrid" },
            { nombre: "Elena M.", materia: "Programación Web", uni: "Univ. Barcelona" },
            { nombre: "Javier G.", materia: "Economía Aplicada", uni: "Univ. Valencia" },
            { nombre: "Sofía L.", materia: "Psicología Social", uni: "Univ. Sevilla" }
        ];

        const stack = document.getElementById('cardStack');

        function createCard(tutor) {
            const card = document.createElement('div');
            card.className = 'tutor-card';
            card.innerHTML = `
                <div class="tutor-image">👤</div>
                <div class="tutor-info">
                    <h3>${tutor.nombre}</h3>
                    <p><b>Materia:</b> ${tutor.materia}</p>
                    <p><b>Ubicación:</b> ${tutor.uni}</p>
                </div>
            `;
            return card;
        }

        // Cargar tarjetas
        tutors.forEach(tutor => {
            const card = createCard(tutor);
            stack.appendChild(card);
        });

        function swipe(direction) {
            const cards = document.querySelectorAll('.tutor-card');
            if (cards.length === 0) return;

            const lastCard = cards[cards.length - 1];
            if (direction === 'left') {
                lastCard.classList.add('swipe-left');
            } else {
                lastCard.classList.add('swipe-right');
                console.log("¡Has conectado con un tutor!");
            }

            setTimeout(() => {
                lastCard.remove();
                if (document.querySelectorAll('.tutor-card').length === 0) {
                    stack.innerHTML = "<h3 style='text-align:center; margin-top:50%;'>No hay más tutores cerca de ti</h3>";
                }
            }, 500);
        }
    </script>
</body>
</html>
