<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSwipe - Confusion to Solution</title>
    <style>
        :root {
            --navy-bg: #0f172a;
            --navy-card: #1e293b;
            --electric-blue: #38bdf8;
            --accent-orange: #f59e0b;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; background: var(--navy-bg);
            color: #f8fafc; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a, var(--navy-bg));
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { color: var(--electric-blue); font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links button {
            background: var(--glass); border: 1px solid var(--glass-border);
            color: white; padding: 10px 18px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; font-weight: 500;
        }
        .nav-links button:hover { background: var(--electric-blue); color: var(--navy-bg); }

        /* --- SECCIONES --- */
        .section { display: none; padding: 40px 20px; animation: fadeIn 0.5s ease; width: 100%; box-sizing: border-box; }
        .active { display: flex; flex-direction: column; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PERFIL SOCIAL INTERACTIVO --- */
        .profile-container {
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;
            max-width: 1000px; width: 100%;
        }

        .profile-card-left {
            background: var(--navy-card); border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 30px; text-align: center;
        }

        .profile-pic-container {
            position: relative; width: 120px; height: 120px; margin: 0 auto 20px;
        }
        .profile-pic {
            width: 100%; height: 100%; border-radius: 50%;
            border: 3px solid var(--electric-blue); object-fit: cover;
        }
        .status-dot {
            position: absolute; bottom: 5px; right: 5px;
            width: 20px; height: 20px; border-radius: 50%;
            background: #22c55e; border: 3px solid var(--navy-card);
        }

        .skill-tag {
            display: inline-block; background: var(--glass);
            border: 1px solid var(--electric-blue); color: var(--electric-blue);
            padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;
            margin: 5px; cursor: pointer; transition: 0.3s;
        }
        .skill-tag:hover { background: var(--electric-blue); color: white; }

        .social-input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white;
        }

        .badge-container {
            display: flex; justify-content: center; gap: 15px; margin-top: 20px;
        }
        .badge { font-size: 1.5rem; opacity: 0.5; filter: grayscale(1); transition: 0.3s; }
        .badge.unlocked { opacity: 1; filter: grayscale(0); transform: scale(1.2); }

        /* --- BOTONES --- */
        .btn-action {
            background: var(--accent-orange); color: white; border: none;
            padding: 15px 35px; border-radius: 30px; cursor: pointer;
            font-weight: bold; transition: 0.3s; width: 100%;
        }
        .btn-action:hover { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }

        /* --- EXPLORAR --- */
        .mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 340px; }
        .mood-box {
            background: var(--navy-card); border: 1px solid var(--glass-border);
            border-radius: 25px; display: flex; align-items: center;
            justify-content: center; padding: 20px; text-align: center;
            transition: 0.3s; height: 160px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="showSection('landing')">LearnSwipe</div>
        <div class="nav-links">
            <button onclick="showSection('landing')">Inicio</button>
            <button onclick="showSection('profile')">Mi Perfil 👤</button>
            <button onclick="showSection('community')">Muro 🫂</button>
            <button onclick="showSection('app')">Explorar 🔍</button>
        </div>
    </nav>

    <div id="landing" class="section active">
        <h1 style="font-size: 3rem; text-align:center;">De la confusión <br><span style="color:var(--electric-blue)">a la solución</span></h1>
        <p style="opacity:0.7;">Tu red social académica interactiva.</p>
        <button class="btn-action" style="width:auto;" onclick="showSection('app')">Empezar a Swipear</button>
    </div>

    <div id="profile" class="section">
        <div class="profile-container">
            <div class="profile-card-left">
                <div class="profile-pic-container">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" class="profile-pic" id="profileImg">
                    <div class="status-dot" id="statusDot"></div>
                </div>
                <h2 id="dispName" style="margin: 0;">Estudiante Pro</h2>
                <p id="dispGrade" style="color: var(--electric-blue); font-size: 0.9rem;">Grado de Ingeniería</p>
                
                <div style="margin: 20px 0;">
                    <span class="skill-tag">Álgebra</span>
                    <span class="skill-tag">Diseño UI</span>
                    <span class="skill-tag">Python</span>
                </div>

                <div class="badge-container">
                    <span class="badge unlocked" title="Primer Match">🥇</span>
                    <span class="badge unlocked" title="Buen Tutor">⭐</span>
                    <span class="badge" title="Explorador (Bloqueado)">🧭</span>
                </div>
            </div>

            <div style="background: var(--glass); padding: 30px; border-radius: 30px; border: 1px solid var(--glass-border);">
                <h3>Personaliza tu Identidad</h3>
                <label style="font-size: 0.8rem; opacity: 0.6;">Nombre Público</label>
                <input type="text" id="inName" class="social-input" placeholder="Ej: Alex Smith" onkeyup="updateProfile()">
                
                <label style="font-size: 0.8rem; opacity: 0.6;">Tu Link de Instagram</label>
                <input type="text" class="social-input" placeholder="@usuario">
                
                <label style="font-size: 0.8rem; opacity: 0.6;">Estado de estudio</label>
                <select class="social-input" onchange="updateStatus(this.value)">
                    <option value="ready">Disponible para estudiar ✅</option>
                    <option value="busy">Concentrado / No molestar 🔴</option>
                </select>

                <button class="btn-action" onclick="alert('¡Perfil actualizado!')">Guardar Dashboard</button>
            </div>
        </div>
    </div>

    <div id="app" class="section">
        <div style="display:flex; flex-wrap:wrap; gap:40px; justify-content:center; align-items:center;">
            <div style="position:relative; width:330px; height:460px;" id="card-stack"></div>
            <div class="mood-grid">
                <div class="mood-box" style="background:url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=300&q=80') center/cover"></div>
                <div class="mood-box">"Haz que cada swipe cuente." ✨</div>
                <div class="mood-box" style="background: #fef2f2; color: #991b1b;">Yo después de 5 minutos de estudio: 😴</div>
                <div class="mood-box" style="font-size:2rem">📚 ☕ 🚀</div>
            </div>
        </div>
        <div style="margin-top:20px; display:flex; gap:30px;">
            <button onclick="swipe('left')" style="background:#ef4444; color:white; border:none; width:65px; height:65px; border-radius:50%; cursor:pointer;">✕</button>
            <button onclick="swipe('right')" style="background:var(--electric-blue); color:var(--navy-bg); border:none; width:65px; height:65px; border-radius:50%; cursor:pointer;">❤</button>
        </div>
    </div>

    <div id="community" class="section">
        <h2>Muro Social 🫂</h2>
        <div style="background: var(--navy-card); padding: 20px; border-radius: 20px; width: 100%; max-width: 500px;">
            <textarea id="postIn" placeholder="¿Qué estás aprendiendo hoy?" style="width:100%; height:80px; background:rgba(0,0,0,0.2); color:white; border:1px solid var(--glass-border); padding:10px; border-radius:12px;"></textarea>
            <button class="btn-action" style="margin-top:10px;" onclick="addPost()">Postear</button>
        </div>
        <div id="feed" style="margin-top:20px; width:100%; max-width:500px;"></div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'app') initCards();
        }

        function updateProfile() {
            const val = document.getElementById('inName').value;
            document.getElementById('dispName').innerText = val || "Estudiante Pro";
        }

        function updateStatus(val) {
            const dot = document.getElementById('statusDot');
            dot.style.background = val === 'ready' ? '#22c55e' : '#ef4444';
        }

        function addPost() {
            const val = document.getElementById('postIn').value; if(!val) return;
            const div = document.createElement('div');
            div.style.cssText = "background:var(--glass); border:1px solid var(--glass-border); padding:15px; border-radius:15px; margin-bottom:10px;";
            div.innerHTML = `<b>Tú:</b> ${val}`;
            document.getElementById('feed').prepend(div);
            document.getElementById('postIn').value = "";
        }

        const tutors = [
            {n:"Carla S.", m:"Marketing", i:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80"},
            {n:"Erik V.", m:"Física", i:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"}
        ];

        function initCards() {
            const s = document.getElementById('card-stack'); s.innerHTML = "";
            tutors.forEach(t => {
                const c = document.createElement('div');
                c.style.cssText = "position:absolute; width:100%; height:100%; background:white; border-radius:30px; overflow:hidden; color:#0f172a; box-shadow:0 15px 40px rgba(0,0,0,0.5);";
                c.className = 'tutor-card';
                c.innerHTML = `<div style="height:70%; background:url('${t.i}') center/cover"></div><div style="padding:20px"><h3>${t.n}</h3><p>${t.m}</p></div>`;
                s.appendChild(c);
            });
        }

        function swipe(dir) {
            const cards = document.querySelectorAll('.tutor-card'); if(cards.length === 0) return;
            const top = cards[cards.length - 1];
            top.style.transition = "0.5s ease";
            top.style.transform = dir === 'right' ? 'translateX(800px) rotate(45deg)' : 'translateX(-800px) rotate(-45deg)';
            top.style.opacity = "0";
            setTimeout(() => top.remove(), 400);
        }
    </script>
</body>
</html>
