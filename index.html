<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSwipe | Connect & Solve</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0f172a;
            --navy-soft: #1e293b;
            --electric-blue: #38bdf8;
            --white: #ffffff;
            --accent-orange: #f59e0b;
            --warm-bg: #fffcf2;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            margin: 0; background: var(--navy-dark); color: var(--white);
            min-height: 100vh; overflow-x: hidden;
        }

        /* FONDO INTERACTIVO RESTAURADO */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
        }

        /* --- NAVEGACIÓN --- */
        .navbar {
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            padding: 15px 40px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.6rem; color: var(--electric-blue); cursor: pointer; }

        .nav-links button {
            background: transparent; border: none; color: white; margin-left: 15px;
            cursor: pointer; font-weight: 600; transition: 0.3s; opacity: 0.7;
        }
        .nav-links button:hover { opacity: 1; color: var(--electric-blue); }

        .noti-container { position: relative; }
        .noti-badge { background: #ef4444; width: 10px; height: 10px; border-radius: 50%; position: absolute; top: 0; right: 0; box-shadow: 0 0 10px #ef4444; }
        
        .noti-dropdown { 
            display: none; position: absolute; top: 40px; right: 0; 
            background: var(--navy-soft); border: 1px solid var(--glass-border); 
            width: 250px; border-radius: 15px; padding: 10px; z-index: 2000;
        }

        /* --- SECCIONES --- */
        .section { display: none; padding: 40px 20px; animation: slideUp 0.6s ease; width: 100%; max-width: 1200px; margin: 0 auto; }
        .active { display: flex; flex-direction: column; align-items: center; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- DASHBOARD --- */
        .welcome-hero { text-align: center; margin-bottom: 40px; }
        .welcome-hero h1 { font-size: 3.5rem; letter-spacing: -2px; margin-bottom: 10px; }
        .stats-bar { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .stat-card { background: var(--glass); padding: 25px 45px; border-radius: 20px; border: 1px solid var(--glass-border); text-align: center; backdrop-filter: blur(10px); }

        .focus-timer { background: linear-gradient(135deg, #0ea5e9, #2563eb); padding: 25px; border-radius: 30px; margin-top: 40px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 15px 35px rgba(37, 99, 235, 0.3); }

        /* --- PERFIL --- */
        .profile-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; width: 100%; }
        .profile-preview { background: var(--navy-soft); padding: 40px; border-radius: 35px; border: 1px solid var(--electric-blue); text-align: center; }
        .user-pic { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--electric-blue); object-fit: cover; margin-bottom: 20px; }

        /* --- MURO --- */
        .muro-layout { display: grid; grid-template-columns: 1fr 250px; gap: 20px; width: 100%; max-width: 900px; }
        .muro-container { background: var(--warm-bg); border-radius: 35px; padding: 30px; color: #444; }
        .feed-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; border-left: 6px solid var(--accent-orange); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* --- EXPLORAR --- */
        .swipe-stack { position: relative; width: 340px; height: 480px; }
        .tutor-card { position: absolute; width: 100%; height: 100%; background: var(--white); border-radius: 35px; overflow: hidden; color: var(--navy-dark); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .btn-main { background: linear-gradient(90deg, var(--accent-orange), #fbbf24); color: white; border: none; padding: 16px 35px; border-radius: 50px; font-weight: 800; cursor: pointer; transition: 0.3s; }

        #toast { visibility: hidden; min-width: 250px; background-color: #22c55e; color: white; text-align: center; border-radius: 15px; padding: 16px; position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%); bottom: 30px; font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <nav class="navbar">
        <div class="logo" onclick="showSection('landing')">LearnSwipe.</div>
        <div class="nav-links">
            <button onclick="showSection('landing')">Dashboard</button>
            <button onclick="showSection('profile')">Mi Perfil</button>
            <button onclick="showSection('community')">Comunidad</button>
            <button onclick="showSection('app')">Explorar</button>
            <div class="noti-container">
                <button onclick="toggleNotifications()">🔔<span class="noti-badge" id="dot"></span></button>
                <div class="noti-dropdown" id="notiBox">
                    <div style="padding:10px; font-size:0.8rem; border-bottom:1px solid var(--glass-border);">✨ ¡Nueva racha de 5 días!</div>
                    <div style="padding:10px; font-size:0.8rem;">🤖 LearnBot: Tienes 3 sugerencias.</div>
                </div>
            </div>
        </div>
    </nav>

    <div id="landing" class="section active">
        <div class="welcome-hero">
            <h1>Hola, <span id="userNameHello" style="color:var(--electric-blue)">Estudiante</span>.</h1>
            <p style="opacity: 0.7; font-size: 1.2rem;">¿Listo para resolver tus dudas hoy?</p>
            <button class="btn-main" onclick="showSection('app')">Encontrar Tutor</button>
        </div>
        <div class="stats-bar">
            <div class="stat-card"><h3>🔥 5</h3><p>Racha</p></div>
            <div class="stat-card"><h3>📚 12</h3><p>Sesiones</p></div>
        </div>
        <div class="focus-timer">
            <h4 style="margin:0">⏳ MODO ENFOQUE</h4>
            <div style="font-size: 2.5rem; font-weight: 800; margin: 10px 0;" id="timer">25:00</div>
            <button onclick="startTimer()" style="background:white; color:#2563eb; border:none; padding:10px 25px; border-radius:15px; font-weight:bold; cursor:pointer;">Iniciar</button>
        </div>
    </div>

    <div id="profile" class="section">
        <div class="profile-layout">
            <div class="profile-preview">
                <img src="https://via.placeholder.com/150" class="user-pic" id="pPicDisp">
                <h2 id="pNameDisp" style="margin:0">Tu Nombre</h2>
                <p id="pGradeDisp" style="color:var(--electric-blue)">Tu Carrera</p>
                <div id="pSkillsDisp"></div>
            </div>
            <div style="background:var(--glass); padding:30px; border-radius:35px; border:1px solid var(--glass-border); backdrop-filter:blur(10px);">
                <h3>Configuración</h3>
                <input type="text" id="inName" placeholder="Nombre" onkeyup="updateProfile()" style="width:100%; padding:15px; margin-bottom:10px; border-radius:12px; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); color:white;">
                <input type="text" id="inGrade" placeholder="Carrera" onkeyup="updateProfile()" style="width:100%; padding:15px; margin-bottom:10px; border-radius:12px; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); color:white;">
                <button class="btn-main" style="width:100%" onclick="showToast('¡Guardado!')">Guardar Perfil</button>
            </div>
        </div>
    </div>

    <div id="community" class="section">
        <div class="muro-layout">
            <div class="muro-container">
                <h2 style="margin:0 0 20px 0; color:var(--navy-dark)">Comunidad 🫂</h2>
                <textarea id="postText" placeholder="¿Qué estudias hoy?" style="width:100%; padding:15px; border-radius:15px; margin-bottom:10px;"></textarea>
                <button class="btn-main" style="width:100%" onclick="addPost()">Publicar</button>
                <div id="feed" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <div id="app" class="section">
        <div class="swipe-stack" id="card-stack"></div>
        <div style="margin-top:40px; display:flex; gap:30px;">
            <button onclick="swipe('left')" style="width:70px; height:70px; border-radius:50%; border:none; background:white; color:#ef4444; font-size:1.5rem; cursor:pointer;">✕</button>
            <button onclick="swipe('right')" style="width:70px; height:70px; border-radius:50%; border:none; background:var(--electric-blue); color:var(--navy-dark); font-size:1.5rem; cursor:pointer;">❤</button>
        </div>
    </div>

    <div id="toast">Acción realizada</div>

    <script>
        // --- FONDO INTERACTIVO ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initBg() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update(); p.draw();
                let dx = mouse.x - p.x; let dy = mouse.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    ctx.strokeStyle = `rgba(56, 189, 248, ${1 - dist/150})`;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                }
            });
            requestAnimationFrame(animateBg);
        }
        initBg(); animateBg();
        window.addEventListener('resize', initBg);

        // --- LÓGICA APP ---
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'app') initCards();
        }

        function toggleNotifications() {
            const box = document.getElementById('notiBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
            document.getElementById('dot').style.display = 'none';
        }

        function updateProfile() {
            document.getElementById('pNameDisp').innerText = document.getElementById('inName').value || "Tu Nombre";
            document.getElementById('pGradeDisp').innerText = document.getElementById('inGrade').value || "Tu Carrera";
            document.getElementById('userNameHello').innerText = (document.getElementById('inName').value || "Estudiante").split(' ')[0];
        }

        function addPost() {
            const text = document.getElementById('postText').value; if(!text) return;
            const div = document.createElement('div'); div.className = 'feed-card';
            div.innerHTML = `<b>Tú:</b> ${text}`;
            document.getElementById('feed').prepend(div);
            document.getElementById('postText').value = "";
        }

        function startTimer() {
            let m = 24, s = 59;
            setInterval(() => {
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(s == 0) { m--; s = 59; } else s--;
            }, 1000);
        }

        function showToast(msg) {
            const x = document.getElementById("toast"); x.innerText = msg;
            x.className = "show"; setTimeout(() => x.className = "", 3000);
        }

        const tutors = [
            {n: "Elena M.", s: "Software Eng.", i: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=400&q=80"},
            {n: "Marc R.", s: "Física", i: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"}
        ];

        function initCards() {
            const stack = document.getElementById('card-stack'); stack.innerHTML = "";
            tutors.forEach(t => {
                const card = document.createElement('div'); card.className = 'tutor-card';
                card.innerHTML = `<div style="height:70%; background:url('${t.i}') center/cover"></div><div style="padding:25px"><h3 style="margin:0">${t.n}</h3><p style="opacity:0.6">${t.s}</p></div>`;
                stack.appendChild(card);
            });
        }

        function swipe(dir) {
            const cards = document.querySelectorAll('.tutor-card'); if(!cards.length) return;
            const top = cards[cards.length - 1];
            top.style.transition = "0.6s ease";
            top.style.transform = dir === 'right' ? 'translateX(1000px) rotate(30deg)' : 'translateX(-1000px) rotate(-30deg)';
            top.style.opacity = "0";
            if(dir === 'right') showToast("¡Match! 🎉");
            setTimeout(() => top.remove(), 600);
        }
    </script>
</body>
</html>
