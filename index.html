<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LearnSwipe Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px;">

    <h1>Prueba de Conexión LearnSwipe</h1>
    
    <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;">
        <input type="text" id="nombrePrueba" placeholder="Escribe tu nombre" style="padding: 10px; border-radius: 5px; border: none;">
        <button onclick="probarFirebase()" style="padding: 10px 20px; background: #38bdf8; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
            ¡Guardar en Google!
        </button>
    </div>

    <p id="estado">Estado: Esperando...</p>

    <script>
        // Tus datos exactos de la captura IMG_2376
        const firebaseConfig = {
            apiKey: "AIzaSyBD0ocsjfTh9DRrYroAwTGfHfsXycFpSAg",
            authDomain: "learnswipe-8357e.firebaseapp.com",
            projectId: "learnswipe-8357e",
            storageBucket: "learnswipe-8357e.firebasestorage.app",
            messagingSenderId: "649764089830",
            appId: "1:649764089830:web:acbef338401a6921e67027"
        };

        // Inicializar
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function probarFirebase() {
            const nombre = document.getElementById('nombrePrueba').value;
            const estado = document.getElementById('estado');
            
            if(!nombre) return alert("Escribe un nombre");

            estado.innerText = "Estado: Conectando con Google...";

            try {
                // Intentamos guardar en una carpeta llamada 'test'
                await db.collection("usuarios").add({
                    nombre: nombre,
                    fecha: new Date().toLocaleString()
                });
                
                estado.innerText = "Estado: ✅ ¡ÉXITO! Datos guardados.";
                estado.style.color = "#4ade80";
                alert("¡Funcionó! Revisa la pestaña 'Data' en Firebase");
                
            } catch (error) {
                console.error(error);
                estado.innerText = "Estado: ❌ Error: " + error.message;
                estado.style.color = "#f87171";
            }
        }
    </script>
</body>
</html>
